<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="lanternGlow" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ff6b6b" />
      <stop offset="60%" stop-color="#e63946" />
      <stop offset="100%" stop-color="#b81d2a" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f9c74f" />
      <stop offset="50%" stop-color="#ffd166" />
      <stop offset="100%" stop-color="#f3722c" />
    </linearGradient>
    <linearGradient id="tasselGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e63946" />
      <stop offset="100%" stop-color="#9e1924" />
    </linearGradient>
  </defs>

  <!-- Hanging String & Loop -->
  <line x1="64" y1="6" x2="64" y2="21" stroke="#3d2b1f" stroke-width="3" stroke-linecap="round" />
  <circle cx="64" cy="18" r="4" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" />
  <circle cx="64" cy="18" r="4" fill="none" stroke="#3d2b1f" stroke-width="1.2" />

  <!-- Bottom Tassel -->
  <g id="tassel">
    <!-- Main Tassel Strands -->
    <path d="M58,101 L55,119 C55,121 57,122 59,122 L69,122 C71,122 73,121 73,119 L70,101 Z" fill="url(#tasselGrad)" stroke="#3d2b1f" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Tassel Strand Lines -->
    <line x1="61" y1="104" x2="60" y2="120" stroke="#3d2b1f" stroke-width="1.3" stroke-linecap="round" />
    <line x1="64" y1="104" x2="64" y2="120" stroke="#3d2b1f" stroke-width="1.3" stroke-linecap="round" />
    <line x1="67" y1="104" x2="68" y2="120" stroke="#3d2b1f" stroke-width="1.3" stroke-linecap="round" />
    <!-- Gold Knot Bead -->
    <rect x="57" y="96" width="14" height="6" rx="3" fill="url(#goldGrad)" stroke="#3d2b1f" stroke-width="2.2" />
  </g>

  <!-- Main Lantern Body -->
  <g id="lantern-body">
    <rect x="24" y="27" width="80" height="64" rx="32" ry="30" fill="url(#lanternGlow)" stroke="#3d2b1f" stroke-width="3" />

    <!-- Lantern Ribs (Curved Lines) -->
    <path d="M46,28 C34,45 34,73 46,90" fill="none" stroke="#9e1924" stroke-width="2" stroke-linecap="round" opacity="0.7" />
    <path d="M82,28 C94,45 94,73 82,90" fill="none" stroke="#9e1924" stroke-width="2" stroke-linecap="round" opacity="0.7" />
    <path d="M35,34 C25,50 25,68 35,84" fill="none" stroke="#9e1924" stroke-width="1.8" stroke-linecap="round" opacity="0.55" />
    <path d="M93,34 C103,50 103,68 93,84" fill="none" stroke="#9e1924" stroke-width="1.8" stroke-linecap="round" opacity="0.55" />

    <!-- Glossy Highlights -->
    <path d="M33,42 C31,48 31,54 33,60" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.55" />
    <circle cx="36" cy="36" r="1.8" fill="#ffffff" opacity="0.65" />
  </g>

  <!-- Top and Bottom Gold Caps -->
  <rect x="44" y="21" width="40" height="8" rx="4" fill="url(#goldGrad)" stroke="#3d2b1f" stroke-width="2.6" />
  <line x1="52" y1="22" x2="52" y2="28" stroke="#3d2b1f" stroke-width="1.4" opacity="0.6" />
  <line x1="64" y1="22" x2="64" y2="28" stroke="#3d2b1f" stroke-width="1.4" opacity="0.6" />
  <line x1="76" y1="22" x2="76" y2="28" stroke="#3d2b1f" stroke-width="1.4" opacity="0.6" />

  <rect x="46" y="89" width="36" height="8" rx="4" fill="url(#goldGrad)" stroke="#3d2b1f" stroke-width="2.6" />
  <line x1="54" y1="90" x2="54" y2="96" stroke="#3d2b1f" stroke-width="1.4" opacity="0.6" />
  <line x1="64" y1="90" x2="64" y2="96" stroke="#3d2b1f" stroke-width="1.4" opacity="0.6" />
  <line x1="74" y1="90" x2="74" y2="96" stroke="#3d2b1f" stroke-width="1.4" opacity="0.6" />

  <!-- Cute Kawaii Face -->
  <g id="face">
    <!-- Left Eye -->
    <circle cx="51" cy="59" r="5" fill="#2b1e16" />
    <circle cx="49.3" cy="57.2" r="1.8" fill="#ffffff" />
    <circle cx="52.4" cy="60.4" r="0.9" fill="#ffffff" />

    <!-- Right Eye -->
    <circle cx="77" cy="59" r="5" fill="#2b1e16" />
    <circle cx="75.3" cy="57.2" r="1.8" fill="#ffffff" />
    <circle cx="78.4" cy="60.4" r="0.9" fill="#ffffff" />

    <!-- Rosy Cheeks -->
    <ellipse cx="43" cy="65" rx="4.5" ry="2.8" fill="#ff8fa3" opacity="0.85" />
    <ellipse cx="85" cy="65" rx="4.5" ry="2.8" fill="#ff8fa3" opacity="0.85" />

    <!-- Happy Smile -->
    <path d="M60,63 Q64,67.5 68,63" fill="none" stroke="#2b1e16" stroke-width="2.4" stroke-linecap="round" />
  </g>

  <!-- Festive Sparkles -->
  <path d="M16,32 L17.5,35.5 L21,37 L17.5,38.5 L16,42 L14.5,38.5 L11,37 L14.5,35.5 Z" fill="#ffd166" stroke="#3d2b1f" stroke-width="1.2" stroke-linejoin="round" />
  <path d="M112,72 L113.2,74.8 L116,76 L113.2,77.2 L112,80 L110.8,77.2 L108,76 L110.8,74.8 Z" fill="#ffd166" stroke="#3d2b1f" stroke-width="1.2" stroke-linejoin="round" />
  <circle cx="109" cy="30" r="2.2" fill="#ffd166" />
  <circle cx="18" cy="82" r="2" fill="#ffd166" />
</svg>
